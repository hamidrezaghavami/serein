services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serein
      POSTGRES_PASSWORD: serein
      POSTGRES_DB: serein
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - serein-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serein -d serein"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  serein-postgres:
